name: Check YouTube comments

# YouTube has no comment webhooks, so ViralChat has to look for new comments.
# Vercel's free plan only runs its own cron once a day, so GitHub calls the check every 5 minutes.
# The endpoint needs no secret: it checks each channel at most every 2 minutes however often it's called.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for new comments and reply
        run: curl -fsS --max-time 90 "${APP_URL:-https://viralchat-ai.vercel.app}/api/cron/youtube"
        env:
          APP_URL: ${{ vars.APP_URL }}
